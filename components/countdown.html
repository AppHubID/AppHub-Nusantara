<div class="countdown" data-countdown aria-label="Hitung mundur menuju peluncuran AppHub.ID">

  <div class="countdown__grid">

    <div class="countdown__unit">
      <span class="countdown__value" data-unit="days">00</span>
      <span class="countdown__label">Hari</span>
    </div>

    <div class="countdown__unit">
      <span class="countdown__value" data-unit="hours">00</span>
      <span class="countdown__label">Jam</span>
    </div>

    <div class="countdown__unit">
      <span class="countdown__value" data-unit="minutes">00</span>
      <span class="countdown__label">Menit</span>
    </div>

    <div class="countdown__unit">
      <span class="countdown__value" data-unit="seconds">00</span>
      <span class="countdown__label">Detik</span>
    </div>

  </div>

  <p class="countdown__status" data-countdown-status hidden></p>

  <noscript>
    <p class="countdown__status">
      Aktifkan JavaScript pada peramban Anda untuk melihat hitung mundur menuju 30 Desember 2026.
    </p>
  </noscript>

</div>
